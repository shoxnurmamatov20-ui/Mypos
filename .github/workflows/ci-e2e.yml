name: E2E Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright web E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build web apps
        run: pnpm -r --filter "@mypos/web-*" --filter "@mypos/kds" build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Start backend infra (postgres + redis)
        run: |
          docker compose -f infra/docker-compose.yml up -d postgres redis
          sleep 10
        continue-on-error: true

      - name: Run Playwright suite
        run: pnpm exec playwright test --config=tests/e2e/playwright.config.ts
        env:
          E2E_BASE_URL: http://localhost:3000
          WEB_CONSUMER_URL: http://localhost:3002
          WEB_PORTAL_URL: http://localhost:3005
          WEB_CEO_URL: http://localhost:3001

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
