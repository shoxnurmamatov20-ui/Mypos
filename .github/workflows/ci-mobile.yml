name: CI Mobile (Expo)

# Typecheck Expo apps. Today: @mypos/pos-terminal only.
# Future: add @mypos/mobile-consumer, @mypos/mobile-staff when they exist.

on:
  push:
    branches: [main]
    paths:
      - 'apps/pos-terminal/**'
      - 'apps/mobile-consumer/**'
      - 'apps/mobile-staff/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
  pull_request:
    branches: [main]
    paths:
      - 'apps/pos-terminal/**'
      - 'apps/mobile-consumer/**'
      - 'apps/mobile-staff/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pos-terminal:
    name: pos-terminal typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck pos-terminal
        run: pnpm --filter @mypos/pos-terminal typecheck
