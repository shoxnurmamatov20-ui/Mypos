# MyPOS — Local Development Infrastructure
#
# DB NOTE (2026-05-10, ADR-0005): MyPOS now uses MySQL 8.4. The MAIN database
# runs via XAMPP on the host (localhost:3306), NOT in Docker. This compose
# file no longer brings up a database service. CI uses its own mysql:8.4
# service container — see .github/workflows/ci.yml.
#
# Services in this file:
#   - redis       : Redis 7.4 (cache, queue, Reverb pub/sub)
#   - meilisearch : Search (Laravel Scout driver)
#   - minio       : S3-compatible object storage (files, images)
#   - caddy       : Reverse proxy with on-demand TLS for custom tenant domains
#                   (opt-in profile "edge" — does not start by default in dev)
#
# Usage:
#   pnpm docker:up       # Start redis + meilisearch + minio
#   pnpm docker:down     # Stop them
#   pnpm docker:logs     # Tail logs
#
# Local DB setup (do this once, separately from docker):
#   1. Open XAMPP Control Panel and click Start next to MySQL.
#   2. Visit http://localhost/phpmyadmin
#   3. Create database `mypos` with collation `utf8mb4_unicode_ci`.
#   4. Default user `root` with empty password works out-of-the-box.
#
# Access:
#   mysql       : localhost:3306 (XAMPP)        — phpMyAdmin: http://localhost/phpmyadmin
#   redis       : localhost:56379
#   meilisearch : http://localhost:7700
#   minio       : http://localhost:9000 (API), http://localhost:9001 (console)
#
# Data persists in named volumes — survives `docker compose down`.
# Use `docker compose down -v` to wipe.

name: mypos

services:
  redis:
    image: redis:7.4-alpine
    container_name: mypos-redis
    restart: unless-stopped
    ports:
      - "56379:6379"   # Host 56379 to avoid clash with other local Redis
    volumes:
      - redis_data:/data
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mypos

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: mypos-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: mypos_meili_local
      MEILI_ENV: development
      MEILI_LOG_LEVEL: INFO
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mypos

  minio:
    image: minio/minio:latest
    container_name: mypos-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: mypos_minio_local
      MINIO_ROOT_PASSWORD: mypos_minio_local_secret
      MINIO_DOMAIN: localhost
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mypos

  minio-setup:
    image: minio/mc:latest
    container_name: mypos-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 mypos_minio_local mypos_minio_local_secret;
      mc mb --ignore-existing local/mypos-local;
      mc anonymous set public local/mypos-local;
      exit 0;
      "
    networks:
      - mypos

  # Caddy reverse proxy — terminates SSL for *.mypos.uz and any custom tenant
  # domain. Custom domains use on-demand TLS gated by the API (see Caddyfile).
  #
  # In dev this service is opt-in: start it with `docker compose --profile edge up`
  # so plain `pnpm docker:up` does not bind 80/443 (which would conflict with
  # whatever local web server you have running). Production always runs it.
  caddy:
    image: caddy:2-alpine
    container_name: mypos-caddy
    restart: unless-stopped
    profiles: ["edge"]
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:2019:2019"   # admin API — loopback only
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_INTERNAL_TOKEN=${CADDY_INTERNAL_TOKEN:-changeme-dev-only}
    networks:
      - mypos
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  minio_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  mypos:
    driver: bridge
    name: mypos-network
